---
on:
  pull_request:
    branches:
      - main
      - next
      - production
  push:
    branches:
      - main
      - production
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

name: Admin Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  check-rulesets:
    name: "Check Rulesets"
    uses: ./.github/workflows/admin-check_rulesets.yml

  pattern-scan:
    name: "Check for forbidden patterns"
    uses: ./.github/workflows/admin-forbidden-patterns.yml

  no-plan-file:
    name: "Check for committed plan files"
    uses: ./.github/workflows/admin-no-plan-file.yml

  pr-size:
    name: "Check PR size"
    uses: ./.github/workflows/admin-pr-size.yml
    with:
      exempt_head_branches: |
        main
        next
        production
      ignore: |
        **/uv.lock
        **/package-lock.json
