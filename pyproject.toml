[project]
name = "stitch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "deployments/api",
  "deployments/seed",
  "deployments/stitch-llm",
  "packages/stitch-auth",
  "packages/stitch-client",
  "packages/stitch-models",
  "packages/stitch-observability",
  "packages/stitch-ogsi",
  "packages/stitch-app",
  "packages/stitch-tasks",
]

[tool.uv.sources]
stitch-auth = { workspace = true }
stitch-client = { workspace = true }

[tool.poe]
include_script = "stitch_tasks.tasks:tasks"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]

[tool.uv]
constraint-dependencies = ["dnspython>=2.9.0", "opentelemetry-api>=1.45.1"]

[tool.ruff]
extend-exclude = ["packages/stitch-tasks/tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
