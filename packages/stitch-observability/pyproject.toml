[project]
name = "stitch-observability"
version = "0.1.0"
description = "Shared OpenTelemetry tracing setup + instrumentation for Stitch services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
asgi = ["starlette>=1.6.0"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stitch.observability"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[dependency-groups]
dev = ["pytest>=9.0.2", "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1", "httpx>=0.28.0"]
